<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아이디어 페스티벌 관리자</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="admin-topbar">
  <div>
    <h1>아이디어 페스티벌 관리자</h1>
    <p>접수 아이디어 확인, 첨부파일 검토, 익명 게시를 진행합니다.</p>
  </div>
  <a href="index.html">사원용 화면</a>
</header>
<main class="admin-container">
  <section id="loginPanel" class="admin-card">
    <h2>관리자 로그인</h2>
    <p class="muted">Supabase Auth에 등록된 관리자 이메일/비밀번호로 로그인하세요.</p>
    <label>이메일<input id="adminEmail" type="email" placeholder="admin@example.com"></label>
    <label>비밀번호<input id="adminPassword" type="password" placeholder="비밀번호"></label>
    <button class="primary" onclick="adminLogin()">로그인</button>
    <p id="loginMsg" class="message"></p>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="admin-actions">
      <button onclick="loadRawIdeas()">접수 목록 새로고침</button>
      <button onclick="adminLogout()">로그아웃</button>
    </div>
    <div id="adminMsg" class="message"></div>
    <div id="rawList" class="raw-list"></div>
  </section>
</main>
<script src="config.sample.js"></script>
<script src="admin.js"></script>
</body>
</html>
